name: Stills

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id for stills"
        required: true
        default: "EP19Test"

jobs:
  stills:
    # Standard runner only — free and unlimited on public repos.
    # Never switch to larger runners (they cost money).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chrome
        run: npx remotion browser ensure

      - name: Install Pillow (storyboard + cover compose)
        run: python3 -m pip install --quiet pillow

      - name: Render stills (one call → storyboard + cover)
        run: npm run stills -- "${{ inputs.composition }}"

      - name: Upload stills
        uses: actions/upload-artifact@v4
        with:
          name: stills
          path: stills/
          retention-days: 7
