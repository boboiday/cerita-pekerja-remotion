name: Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id to render"
        required: true
        default: "Sample10s"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "remotion.config.ts"

jobs:
  render:
    # Standard runner only — free and unlimited on public repos.
    # Never switch to larger runners (they cost money).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chrome
        run: npx remotion browser ensure

      - name: Render
        run: npx remotion render src/index.ts "${{ inputs.composition || 'Sample10s' }}" out.mp4 --overwrite

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out.mp4
          retention-days: 7
